<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pisces Hit List</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ====== CSS RESET & VARIABLES ====== */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e1a;
  --bg2:#0f1424;
  --bg3:#141a2e;
  --surface:#1a2140;
  --surface2:#1e2548;
  --border:#2a3460;
  --border-glow:#3a4a8a;
  --text:#c8d0e8;
  --text2:#8892b0;
  --text3:#5a6480;
  --accent:#4fc3f7;
  --accent2:#00e5ff;
  --accent-dim:#2a7a9a;
  --danger:#ff5252;
  --danger-dim:#8b2020;
  --warning:#ffab40;
  --success:#69f0ae;
  --purple:#b388ff;
  --pink:#f48fb1;
  --gold:#ffd54f;
  --lv1:#4fc3f7;
  --lv2:#29b6f6;
  --lv3:#ffab40;
  --lv4:#ff7043;
  --lv5:#ff5252;
  --status-lurk:#4fc3f7;
  --status-surface:#ffab40;
  --status-caught:#69f0ae;
  --status-release:#b388ff;
  --font-mono:'Space Mono', monospace;
  --font-body:'Noto Sans SC', sans-serif;
  --radius:12px;
  --radius-sm:8px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-body);font-weight:400;font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}

/* ====== BUBBLE PARTICLES ====== */
.bubbles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:0}
.bubble{position:absolute;bottom:-20px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(79,195,247,0.15),rgba(79,195,247,0.03));animation:rise linear infinite;opacity:0}
@keyframes rise{
  0%{transform:translateY(0) translateX(0) scale(1);opacity:0}
  10%{opacity:1}
  90%{opacity:0.6}
  100%{transform:translateY(-110vh) translateX(var(--drift)) scale(var(--end-scale));opacity:0}
}

/* ====== WAVE ANIMATION ====== */
.wave-border{position:fixed;bottom:54px;left:0;right:0;height:40px;z-index:1;overflow:hidden;pointer-events:none}
.wave-border svg{position:absolute;bottom:0;width:200%;height:40px;animation:waveSlide 8s linear infinite}
@keyframes waveSlide{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* ====== APP SHELL ====== */
#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}
.page{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 120px;display:none;-webkit-overflow-scrolling:touch}
.page.active{display:block}
.page::-webkit-scrollbar{width:4px}
.page::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* ====== SPLASH SCREEN ====== */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;transition:opacity 0.6s, transform 0.6s}
#splash.hide{opacity:0;transform:scale(1.05);pointer-events:none}
.splash-art{width:200px;height:200px;border-radius:50%;object-fit:cover;margin-bottom:24px;border:2px solid rgba(79,195,247,0.2);box-shadow:0 0 40px rgba(79,195,247,.15),0 0 80px rgba(179,136,255,.08);animation:splashGlow 3s ease-in-out infinite}
@keyframes splashGlow{0%,100%{box-shadow:0 0 40px rgba(79,195,247,.15),0 0 80px rgba(179,136,255,.08)}50%{box-shadow:0 0 60px rgba(79,195,247,.25),0 0 100px rgba(179,136,255,.15)}}
.splash-title{font-family:var(--font-mono);font-size:22px;font-weight:700;color:var(--accent);letter-spacing:2px;margin-bottom:16px;text-transform:uppercase}
.splash-quote{font-size:15px;color:var(--text2);max-width:300px;line-height:1.8;margin-bottom:40px}
.splash-enter{background:transparent;border:1px solid var(--accent);color:var(--accent);font-family:var(--font-mono);font-size:14px;padding:12px 32px;border-radius:30px;cursor:pointer;letter-spacing:1px;transition:all 0.3s}
.splash-enter:hover,.splash-enter:active{background:var(--accent);color:var(--bg)}

/* ====== BOTTOM NAV ====== */
.nav{position:fixed;bottom:0;left:0;right:0;height:54px;background:var(--bg2);border-top:1px solid var(--border);display:flex;z-index:50}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;color:var(--text3);font-size:10px;font-family:var(--font-body);cursor:pointer;transition:color 0.2s}
.nav-btn.active{color:var(--accent)}
.nav-btn .nav-icon{font-size:20px}

/* ====== WATERMARK ====== */
.watermark{position:fixed;bottom:58px;left:0;right:0;text-align:center;font-size:10px;color:var(--text3);opacity:0.4;z-index:3;pointer-events:none;font-family:var(--font-mono);letter-spacing:0.5px}

/* ====== DASHBOARD ====== */
.dash-hero{position:relative;border-radius:var(--radius);overflow:hidden;margin-bottom:16px;min-height:140px;display:flex;align-items:flex-end}
.dash-hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35}
.dash-hero-overlay{position:absolute;inset:0;background:linear-gradient(transparent 30%,var(--bg) 100%)}
.dash-hero-content{position:relative;z-index:2;padding:16px;width:100%}
.weather-card{background:linear-gradient(135deg,var(--surface),var(--bg3));border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;text-align:center}
.weather-text{font-size:14px;color:var(--text);line-height:1.8}
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 10px;text-align:center}
.stat-num{font-family:var(--font-mono);font-size:24px;font-weight:700;color:var(--accent)}
.stat-label{font-size:11px;color:var(--text2);margin-top:4px}
.countdown-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.countdown-name{font-size:14px;color:var(--text)}
.countdown-days{font-family:var(--font-mono);font-size:18px;font-weight:700;color:var(--warning)}
.quote-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:16px;text-align:center;font-size:13px;color:var(--text2);line-height:1.8;font-style:italic}
.section-title{font-family:var(--font-mono);font-size:12px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;margin:20px 0 10px}
.share-btn{display:block;width:100%;margin-top:16px;padding:14px;background:transparent;border:1px solid var(--border);border-radius:var(--radius);color:var(--text2);font-size:13px;font-family:var(--font-body);cursor:pointer;transition:all 0.3s}
.share-btn:active{background:var(--surface);border-color:var(--accent)}

/* ====== ENEMY LIST ====== */
.list-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sort-pill{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--text3);font-size:12px;font-family:var(--font-body);cursor:pointer;transition:all .2s}
.sort-pill.active{border-color:var(--accent);color:var(--accent);background:rgba(79,195,247,0.1)}
.enemy-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden}
.enemy-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.enemy-card[data-level="1"]::before{background:var(--lv1)}
.enemy-card[data-level="2"]::before{background:var(--lv2)}
.enemy-card[data-level="3"]::before{background:var(--lv3)}
.enemy-card[data-level="4"]::before{background:var(--lv4)}
.enemy-card[data-level="5"]::before{background:var(--lv5)}
.enemy-card:active{background:var(--surface2);transform:scale(0.98)}
.enemy-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.enemy-name{font-size:16px;font-weight:700;color:var(--text)}
.enemy-level{font-family:var(--font-mono);font-size:11px;padding:3px 8px;border-radius:20px;white-space:nowrap}
.enemy-level[data-l="1"]{background:rgba(79,195,247,0.15);color:var(--lv1)}
.enemy-level[data-l="2"]{background:rgba(41,182,246,0.15);color:var(--lv2)}
.enemy-level[data-l="3"]{background:rgba(255,171,64,0.15);color:var(--lv3)}
.enemy-level[data-l="4"]{background:rgba(255,112,67,0.15);color:var(--lv4)}
.enemy-level[data-l="5"]{background:rgba(255,82,82,0.15);color:var(--lv5)}
.enemy-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--text3)}
.enemy-badge{padding:2px 6px;border-radius:4px;font-size:10px}
.badge-trauma{background:rgba(255,82,82,0.12);color:var(--danger)}
.badge-annoyed{background:rgba(79,195,247,0.12);color:var(--accent)}
.enemy-status{display:flex;align-items:center;gap:4px}
.progress-bar{width:60px;height:4px;background:var(--bg);border-radius:2px;overflow:hidden;margin-left:auto}
.progress-fill{height:100%;border-radius:2px;background:var(--accent);transition:width 0.3s}

.fab{position:fixed;bottom:70px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--accent);border:none;color:var(--bg);font-size:28px;cursor:pointer;z-index:40;box-shadow:0 4px 20px rgba(79,195,247,0.3);transition:transform 0.2s}
.fab:active{transform:scale(0.9)}
.empty-art{width:80%;max-width:300px;border-radius:var(--radius);opacity:.5;margin-bottom:16px}
.empty-state{text-align:center;padding:60px 20px;color:var(--text3);font-size:14px;line-height:2}

/* ====== DETAIL PAGE ====== */
.detail-page{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;display:none;padding-bottom:40px}
.detail-page.open{display:block;animation:slideUp 0.3s ease-out}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.detail-banner{width:100%;height:120px;object-fit:cover;opacity:.3;display:block}
.detail-header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.back-btn,.del-btn{background:none;border:none;color:var(--text2);font-size:14px;cursor:pointer;padding:4px 8px}
.del-btn{color:var(--danger)}
.detail-body{padding:16px}
.detail-section{margin-bottom:20px}
.detail-label{font-family:var(--font-mono);font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.detail-value{font-size:14px;color:var(--text);line-height:1.7}
.tag-list{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;padding:3px 10px;border-radius:20px;background:var(--bg3);border:1px solid var(--border);color:var(--text2)}

/* Tasks checklist */
.task-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.task-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);background:none;cursor:pointer;flex-shrink:0;transition:all 0.2s;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent}
.task-check.done{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.task-text{flex:1;font-size:13px;color:var(--text)}
.task-text.done-text{text-decoration:line-through;color:var(--text3)}
.add-task-row{display:flex;gap:8px;margin-top:8px}
.add-task-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;color:var(--text);font-size:13px;font-family:var(--font-body)}
.add-task-btn{background:var(--accent);border:none;color:var(--bg);border-radius:var(--radius-sm);padding:8px 14px;font-size:13px;cursor:pointer}

/* Status selector */
.status-row{display:flex;gap:8px;flex-wrap:wrap}
.status-opt{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--text2);font-size:12px;cursor:pointer;transition:all 0.2s}
.status-opt.active{border-color:var(--accent);color:var(--accent);background:rgba(79,195,247,0.1)}

/* Diary */
.diary-entry{padding:12px 0;border-bottom:1px solid rgba(42,52,96,0.5)}
.diary-date{font-family:var(--font-mono);font-size:10px;color:var(--text3)}
.diary-text{font-size:13px;color:var(--text);margin-top:4px;line-height:1.7}
.diary-input-row{display:flex;gap:8px;margin-top:10px}
.diary-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;color:var(--text);font-size:13px;font-family:var(--font-body);resize:none}

/* Level history chart */
.history-chart{height:80px;display:flex;align-items:flex-end;gap:2px;padding:10px 0}
.chart-bar{flex:1;min-width:4px;max-width:12px;border-radius:2px 2px 0 0;transition:height 0.3s}

/* Relationship */
.relation-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(42,52,96,0.3);font-size:13px}
.relation-name{color:var(--accent)}
.relation-desc{color:var(--text3);font-size:12px}

/* MBTI Section */
.mbti-section{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:10px}
.mbti-type{font-family:var(--font-mono);font-size:28px;font-weight:700;color:var(--danger);text-align:center;margin:10px 0}
.fortune-block{margin-top:12px;padding:12px;background:var(--surface);border-radius:var(--radius-sm);border-left:3px solid var(--danger)}
.fortune-label{font-size:11px;color:var(--text3);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.fortune-text{font-size:13px;color:var(--text);line-height:1.7}

/* Phil comment */
.phil-section{background:linear-gradient(135deg,rgba(26,33,64,0.8),rgba(20,26,46,0.8));border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:10px;position:relative}
.phil-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.phil-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;border:1px solid var(--border)}
.phil-name{font-size:12px;color:var(--text3);font-family:var(--font-mono)}
.phil-text{font-size:13px;color:var(--text);line-height:1.8}

/* ====== FORM / MODAL ====== */
.modal{position:fixed;inset:0;z-index:70;background:var(--bg);overflow-y:auto;display:none;animation:slideUp 0.3s ease-out}
.modal.open{display:block}
.modal-header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.modal-title{font-size:16px;font-weight:700}
.modal-close{background:none;border:none;color:var(--text2);font-size:22px;cursor:pointer}
.form-body{padding:16px;padding-bottom:40px}
.field{margin-bottom:20px}
.field-label{font-size:12px;color:var(--text2);margin-bottom:6px;font-family:var(--font-mono);letter-spacing:0.5px}
.field-input,.field-textarea,.field-select{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;color:var(--text);font-size:14px;font-family:var(--font-body);transition:border-color 0.2s}
.field-input:focus,.field-textarea:focus,.field-select:focus{outline:none;border-color:var(--accent)}
.field-textarea{resize:vertical;min-height:80px;line-height:1.6}
.field-select{-webkit-appearance:none;appearance:none}

/* Level picker */
.level-picker{display:flex;gap:8px}
.level-opt{flex:1;padding:10px 4px;border-radius:var(--radius-sm);border:1px solid var(--border);background:none;color:var(--text2);font-size:11px;text-align:center;cursor:pointer;transition:all 0.2s;line-height:1.4}
.level-opt.sel{border-width:2px}
.level-opt[data-v="1"].sel{border-color:var(--lv1);color:var(--lv1);background:rgba(79,195,247,0.08)}
.level-opt[data-v="2"].sel{border-color:var(--lv2);color:var(--lv2);background:rgba(41,182,246,0.08)}
.level-opt[data-v="3"].sel{border-color:var(--lv3);color:var(--lv3);background:rgba(255,171,64,0.08)}
.level-opt[data-v="4"].sel{border-color:var(--lv4);color:var(--lv4);background:rgba(255,112,67,0.08)}
.level-opt[data-v="5"].sel{border-color:var(--lv5);color:var(--lv5);background:rgba(255,82,82,0.08)}

/* Choice pills */
.pill-row{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--text2);font-size:12px;cursor:pointer;transition:all 0.2s}
.pill.sel{border-color:var(--accent);color:var(--accent);background:rgba(79,195,247,0.1)}
.pill-danger.sel{border-color:var(--danger);color:var(--danger);background:rgba(255,82,82,0.1)}

/* Tag input */
.tag-input-area{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag-preset{padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--text3);font-size:11px;cursor:pointer;transition:all 0.2s}
.tag-preset.sel{border-color:var(--purple);color:var(--purple);background:rgba(179,136,255,0.1)}
.custom-tag-input{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px 10px;color:var(--text);font-size:11px;width:80px;font-family:var(--font-body)}

/* MBTI in form */
.mbti-trait-grid{display:flex;flex-wrap:wrap;gap:6px}
.mbti-trait{padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--text2);font-size:11px;cursor:pointer;transition:all 0.2s}
.mbti-trait.sel{border-color:var(--pink);color:var(--pink);background:rgba(244,143,177,0.1)}

/* Submit */
.submit-btn{width:100%;padding:14px;background:var(--accent);border:none;border-radius:var(--radius);color:var(--bg);font-size:15px;font-weight:700;font-family:var(--font-body);cursor:pointer;margin-top:10px;transition:transform 0.1s}
.submit-btn:active{transform:scale(0.98)}

/* ====== ACHIEVEMENTS TAB ====== */
.ach-card{display:flex;gap:12px;align-items:center;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;transition:opacity 0.2s}
.ach-card.locked{opacity:0.4}
.ach-icon{font-size:28px;flex-shrink:0}
.ach-info{flex:1}
.ach-name{font-size:14px;font-weight:700;color:var(--text)}
.ach-desc{font-size:11px;color:var(--text3);margin-top:2px}
.ach-card.locked .ach-name{color:var(--text3)}

/* ====== TOAST ====== */
.toast{position:fixed;top:-80px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--bg);padding:12px 20px;border-radius:var(--radius);font-size:13px;font-weight:700;z-index:200;transition:top 0.4s cubic-bezier(0.34,1.56,0.64,1);white-space:nowrap;box-shadow:0 4px 20px rgba(255,213,79,0.3)}
.toast.show{top:20px}

/* ====== SHARE CARD CANVAS (hidden) ====== */
#shareCanvas{display:none}
.share-overlay{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px}
.share-overlay.open{display:flex}
.share-img{max-width:90%;max-height:70vh;border-radius:var(--radius)}
.share-hint{color:var(--text3);font-size:12px;margin-top:12px}
.share-close{margin-top:16px;padding:10px 24px;background:var(--surface);border:1px solid var(--border);border-radius:20px;color:var(--text);font-size:13px;cursor:pointer}

/* ====== EXPORT SECTION ====== */
.export-section{margin-top:24px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.export-btn{padding:10px 20px;border-radius:var(--radius-sm);border:1px solid var(--border);background:none;color:var(--text2);font-size:13px;cursor:pointer;margin-right:8px;transition:all 0.2s}
.export-btn:active{background:var(--surface2)}
.import-label{padding:10px 20px;border-radius:var(--radius-sm);border:1px solid var(--border);color:var(--text2);font-size:13px;cursor:pointer;display:inline-block}
#importFile{display:none}
</style>
</head>
<body>

<!-- Bubbles background -->
<div class="bubbles" id="bubbles"></div>

<!-- Wave border -->

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function daysSince(d){return Math.floor((Date.now()-new Date(d).getTime())/86400000)}
function daysUntil(d){return Math.ceil((new Date(d).getTime()-Date.now())/86400000)}
function seededQuote(){
  const day=Math.floor(Date.now()/86400000);
  return APP_DATA.dailyQuotes[day%APP_DATA.dailyQuotes.length];
}
function fmt(d){if(!d)return'';const o=new Date(d);return o.getFullYear()+'-'+String(o.getMonth()+1).padStart(2,'0')+'-'+String(o.getDate()).padStart(2,'0')}
function fmtNow(){return new Date().toISOString().slice(0,16).replace('T',' ')}

function showToast(msg){

// WEATHER FORECAST
// ============================================================
function getWeather(){
  const fc=APP_DATA.weatherForecasts;
  if(enemies.length===0) return fc.find(f=>f.condition==='no_enemies').text;
  const active=enemies.filter(e=>e.status!=='caught'&&e.status!=='release');
  if(active.length===0) return fc.find(f=>f.condition==='all_resolved').text;
  const avg=enemies.reduce((s,e)=>s+e.level,0)/enemies.length;
  const hasCountdown=enemies.some(e=>e.targetDate&&daysUntil(e.targetDate)>0&&daysUntil(e.targetDate)<=7);
  const hasTrauma=enemies.some(e=>e.trauma);
  const recentNew=enemies.filter(e=>daysSince(e.createdAt)<7).length>=3;
  const mostlyLurk=enemies.filter(e=>e.status==='lurk').length>enemies.length*0.7;
  if(recentNew) return fc.find(f=>f.condition==='new_enemy_recent').text;
  if(hasCountdown) return fc.find(f=>f.condition==='has_countdown').text;
  if(hasTrauma&&avg>=3.5) return fc.find(f=>f.condition==='has_trauma').text;
  if(avg>=4) return fc.find(f=>f.condition==='avg_high').text;
  if(avg>=2.5) return fc.find(f=>f.condition==='avg_medium').text;
  if(mostlyLurk) return fc.find(f=>f.condition==='mostly_lurking').text;
  if(avg<2.5) return fc.find(f=>f.condition==='avg_low').text;
  return fc.find(f=>f.condition==='default').text;
}

function renderDash(){
  const el=document.getElementById('pageDash');
  const total=enemies.length;
  const lurk=enemies.filter(e=>e.status==='lurk').length;
  const surfacing=enemies.filter(e=>e.status==='surface').length;
  const caught=enemies.filter(e=>e.status==='caught').length;
  const released=enemies.filter(e=>e.status==='release').length;
  const avgLevel=total?((enemies.reduce((s,e)=>s+e.level,0)/total).toFixed(1)):'0';
  const traumaCount=enemies.filter(e=>e.trauma).length;
  const traumaPct=total?Math.round(traumaCount/total*100):0;

  // countdowns
  const countdowns=enemies.filter(e=>e.targetDate&&daysUntil(e.targetDate)>0).sort((a,b)=>daysUntil(a.targetDate)-daysUntil(b.targetDate)).slice(0,2);

  let h=`<div class="dash-hero"><img class="dash-hero-img" src="${IMG_DASHBOARD}"><div class="dash-hero-overlay"></div><div class="dash-hero-content"><div class="weather-text">${esc(getWeather())}</div></div></div>`;

    <div class="stat-card"><div class="stat-num" style="color:var(--warning)">${surfacing}</div><div class="stat-label">浮出水面</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--purple)">${released}</div><div class="stat-label">已放生</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--status-lurk)">${lurk}</div><div class="stat-label">潜伏中</div></div>
    <div class="stat-card"><div class="stat-num">${avgLevel}</div><div class="stat-label">平均憎恨</div></div>
  </div>`;

  if(traumaCount>0){
    h+=`<div style="text-align:center;font-size:12px;color:var(--danger);margin-bottom:12px">⚠️ trauma 占比 ${traumaPct}%（${traumaCount}/${total}）</div>`;
  }

  if(countdowns.length){
    h+=`<div class="section-title">⏰ 报复倒计时</div>`;
    countdowns.forEach(e=>{
      const d=daysUntil(e.targetDate);
      h+=`<div class="countdown-card"><span class="countdown-name">${esc(e.name)}</span><span class="countdown-days">${d}天</span></div>`;

  h+=`<div class="quote-card">"${esc(seededQuote())}"</div>`;

  // Export section
  h+=`<div class="export-section">

    <button class="export-btn" onclick="exportData()">导出 JSON</button>
    <label class="import-label">导入 JSON<input type="file" id="importFile" accept=".json" onchange="importData(event)"></label>
  </div>`;

  el.innerHTML=h;

function sortEnemiesQuiet(by){
  if(by==='level') enemies.sort((a,b)=>b.level-a.level);
  else if(by==='time') enemies.sort((a,b)=>{const ta=a.hatredTime||a.createdAt;const tb=b.hatredTime||b.createdAt;return String(tb).localeCompare(String(ta))});
  else if(by==='difficulty'){const ord={'需要精心策划':0,'只差行动力':1,'等他自己作死':2};enemies.sort((a,b)=>(ord[a.difficulty]||9)-(ord[b.difficulty]||9))}
  else if(by==='urgent'){enemies.sort((a,b)=>{const da=a.targetDate?daysUntil(a.targetDate):99999;const db=b.targetDate?daysUntil(b.targetDate):99999;return da-db})}
}
function sortEnemies(by){
  currentSort=by;
  sortEnemiesQuiet(by);
  save();renderList();
}

function pickPill(el,group){

function toggleTag(el){el.classList.toggle('sel')}

  if(!el.classList.contains('sel')&&selected.length>=4)return;

function addCustomTag(){
  const inp=document.getElementById('customTag');
  const v=inp.value.trim();
  if(!v)return;
  const btn=document.createElement('button');
  btn.className='tag-preset sel';
  btn.textContent=v;
  btn.onclick=function(){this.classList.toggle('sel')};
  inp.parentElement.insertBefore(btn,inp);
  inp.value='';
}

function getFormLevel(){
  const sel=document.querySelector('.level-opt.sel');
  return sel?parseInt(sel.dataset.v):3;
}
function getFormTrauma(){
  const pills=document.querySelectorAll('.field .pill-row .pill.sel');
  for(const p of pills){if(p.textContent.includes('trauma'))return true}
  return false;
}
function getFormDifficulty(){
  const pills=document.querySelectorAll('.field .pill-row .pill.sel');
  for(const p of pills){
    const t=p.textContent.trim();
    if(DIFFICULTY_LIST.includes(t))return t;
  }
  return DIFFICULTY_LIST[0];
}
function getFormTags(){
  return [...document.querySelectorAll('.tag-preset.sel')].map(b=>b.textContent.trim());
}
function getFormTraits(){
  return [...document.querySelectorAll('.mbti-trait.sel')].map(b=>b.textContent.trim());
}

function inferMBTI(traits){
  if(!traits.length)return null;
  const scores={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  traits.forEach(t=>{
    const map=APP_DATA.behaviorTraits[t];
    if(map)Object.entries(map).forEach(([k,v])=>scores[k]+=v);
  });
  let result='';
  result+=scores.E>=scores.I?'E':'I';
  result+=scores.S>=scores.N?'S':'N';
  result+=scores.T>=scores.F?'T':'F';
  result+=scores.J>=scores.P?'J':'P';
  return result;
}

function submitForm(){
  const name=document.getElementById('fName').value.trim();
  if(!name){showToast('至少给个代号');return}
  const level=getFormLevel();
  const trauma=getFormTrauma();
  const difficulty=getFormDifficulty();
  const tags=getFormTags();
  const traits=getFormTraits();
  const mbtiInput=document.getElementById('fMbti').value.trim().toUpperCase();
  const mbti=mbtiInput.length===4?mbtiInput:inferMBTI(traits);
  const hatredTime=document.getElementById('fTime').value.trim();
  const reason=document.getElementById('fReason').value.trim();
  const plan=document.getElementById('fPlan').value.trim();
  const targetDate=document.getElementById('fDate').value||null;

  // Relations
  let relations=[];
  const relEnemy=document.getElementById('fRelEnemy');
  if(relEnemy&&relEnemy.value){
    relations=[{enemyId:relEnemy.value,desc:document.getElementById('fRelDesc').value.trim()}];
  }

  if(editingId){
    const e=enemies.find(x=>x.id===editingId);
    if(!e)return;
    const oldLevel=e.level;
    Object.assign(e,{name,level,trauma,difficulty,tags,traits,mbti,hatredTime,reason,plan,targetDate,relations,updatedAt:new Date().toISOString()});
    if(oldLevel!==level){
      e.levelHistory=e.levelHistory||[];
      e.levelHistory.push({from:oldLevel,to:level,date:new Date().toISOString()});
    }
    // Check if re-added from release
    if(e._wasReleased&&e.status!=='release'){
      e._wasReleased=false;
      tryUnlock('soft_but_useless');
    }
  } else {
    const newEnemy={
      id:uid(),name,level,trauma,difficulty,tags,traits,mbti,hatredTime,reason,plan,targetDate,relations,
      status:'lurk',tasks:[],diary:[],levelHistory:[{from:0,to:level,date:new Date().toISOString()}],
      createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()
    };
    enemies.push(newEnemy);
    checkNewEnemyAchievements(newEnemy);
  }
  save();closeForm();renderAll();
  showToast(editingId?'已更新':'已加入名单 🐟');
}

  if(e.relations?.length){
    h+=`<div class="detail-section"><div class="detail-label">仇人关系</div>`;
    e.relations.forEach(r=>{
      const other=enemies.find(x=>x.id===r.enemyId);
      if(other) h+=`<div class="relation-item"><span class="relation-name" onclick="openDetail('${other.id}')">${esc(other.name)}</span><span class="relation-desc">${esc(r.desc)}</span></div>`;
    });
    h+=`</div>`;
  }

  // Level history
  if(e.levelHistory?.length>1){
    h+=`<div class="detail-section"><div class="detail-label">憎恨走势</div><div class="history-chart">`;
    const colors=['','var(--lv1)','var(--lv2)','var(--lv3)','var(--lv4)','var(--lv5)'];
    e.levelHistory.forEach(lh=>{
      const pct2=lh.to/5*100;
      h+=`<div class="chart-bar" style="height:${pct2}%;background:${colors[lh.to]}" title="${lh.date?.slice(0,10)||''}: ${lh.from}→${lh.to}"></div>`;
    });
    h+=`</div></div>`;
  }

  // Diary
  h+=`<div class="detail-section"><div class="detail-label">记仇日记</div>`;
  (e.diary||[]).slice().reverse().forEach(d=>{
    h+=`<div class="diary-entry"><div class="diary-date">${esc(d.date)}</div><div class="diary-text">${esc(d.text)}</div></div>`;
  });
  h+=`<div class="diary-input-row"><textarea class="diary-input" id="diaryInput" rows="2" placeholder="追加吐槽…"></textarea><button class="add-task-btn" onclick="addDiary('${e.id}')" style="align-self:flex-end">记</button></div></div>`;

  // MBTI + Fortune
  if(e.mbti&&APP_DATA.mbtifortunes[e.mbti]){
    const f=APP_DATA.mbtifortunes[e.mbti];
    h+=`<div class="detail-section"><div class="detail-label">🔮 恶毒算命</div>
    <div class="mbti-section">
      <div class="mbti-type">${e.mbti}</div>
      <div style="text-align:center;font-size:13px;color:var(--text2);margin-bottom:12px">${esc(f.type_roast)}</div>
      <div class="fortune-block"><div class="fortune-label">命运预测</div><div class="fortune-text">${esc(f.destiny)}</div></div>
      <div class="fortune-block" style="margin-top:8px;border-color:var(--purple)"><div class="fortune-label">来世报应</div><div class="fortune-text">${esc(f.past_life_karma)}</div></div>
      <div class="fortune-block" style="margin-top:8px;border-color:var(--warning)"><div class="fortune-label">克星属性</div><div class="fortune-text">${esc(f.nemesis)}</div></div>
    </div></div>`;
  }

  // Phil comment
  const philText=getPhilComment(e);
  if(philText){
    h+=`<div class="detail-section"><div class="detail-label">🐾 Phil 点评</div>
    <div class="phil-section">
      <div class="phil-header"><img class="phil-avatar" src="${IMG_PHIL}"><div class="phil-name">Phil · 给妈妈的话</div></div>
      <div class="phil-text">${esc(philText)}</div>
    </div></div>`;
  }

  h+=`</div>`;
  dp.innerHTML=h;
  dp.classList.add('open');
}

function closeDetail(){document.getElementById('detailPage').classList.remove('open')}

function changeStatus(id,status){
  const e=enemies.find(x=>x.id===id);
  if(!e)return;
  if(e.status==='release'&&status!=='release'){e._wasReleased=true}
  const prev=e.status;
  e.status=status;
  e.updatedAt=new Date().toISOString();
  save();
  openDetail(id);
  if(status==='caught'&&prev!=='caught'){
    tryUnlock('first_resolved');
    if(e.difficulty==='只差行动力')tryUnlock('gentle_blade');
    checkGrudgeMaster();
  }
  if(status==='release'&&prev!=='release'){
    tryUnlock('first_released');
    checkGrudgeMaster();
  }
}

function deleteEnemy(id){
  if(!confirm('确定删除这个仇人？'))return;
  enemies=enemies.filter(e=>e.id!==id);
  save();closeDetail();renderAll();
}

function toggleTask(id,idx){
  const e=enemies.find(x=>x.id===id);
  if(!e)return;
  e.tasks[idx].done=!e.tasks[idx].done;save();openDetail(id);
}
function removeTask(id,idx){
  const e=enemies.find(x=>x.id===id);
  if(!e)return;
  e.tasks.splice(idx,1);save();openDetail(id);
}
function addTask(id){
  const inp=document.getElementById('newTask');
  const v=inp.value.trim();
  if(!v)return;
  const e=enemies.find(x=>x.id===id);
  if(!e)return;
  e.tasks=e.tasks||[];
  e.tasks.push({text:v,done:false});
  save();openDetail(id);
}

function addDiary(id){
  const inp=document.getElementById('diaryInput');
  const v=inp.value.trim();
  if(!v)return;
  const e=enemies.find(x=>x.id===id);
  if(!e)return;
  e.diary=e.diary||[];
  e.diary.push({text:v,date:fmtNow()});
  save();openDetail(id);
  // Achievement check
  if(e.diary.length>=5)tryUnlock('obsessed');
}

// ============================================================
// PHIL COMMENTS
// ============================================================
function getPhilComment(e){
  const pc=APP_DATA.philComments;
  let pool=[];
  if(e.status==='release') pool=pc.released;
  else if(e.trauma) pool=pc.trauma;
  else if(e.level===5) pool=pc.level_5;
  else if(e.level===4) pool=pc.level_4;
  else if(e.level===3) pool=pc.level_3;
  else if(e.level===2) pool=pc.level_2;
  else pool=pc.level_1;
  if(!pool.length)return null;
  const seed=e.id.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  return pool[seed%pool.length];
}

// ============================================================
// ACHIEVEMENTS
// ============================================================
function renderAch(){
  const el=document.getElementById('pageAch');
  let h=`<div class="section-title">🏆 成就</div>`;
  APP_DATA.achievements.forEach(a=>{
    const got=unlocked.includes(a.id);
    h+=`<div class="ach-card${got?'':' locked'}">
      <div class="ach-icon">${a.icon}</div>
      <div class="ach-info"><div class="ach-name">${esc(a.name)}</div><div class="ach-desc">${esc(a.desc)}</div></div>
      ${got?'<div style="color:var(--gold);font-size:12px">✓ 已解锁</div>':''}
    </div>`;
  });
  el.innerHTML=h;
}

function tryUnlock(achId){
  if(unlocked.includes(achId))return;
  const a=APP_DATA.achievements.find(x=>x.id===achId);
  if(!a)return;
  unlocked.push(achId);
  save();
  showToast(`${a.icon} 成就解锁：${a.name}`);
}

function checkNewEnemyAchievements(e){
  tryUnlock('first_enemy');
  if(e.level===5)tryUnlock('max_hatred');
  if(enemies.length>=5)tryUnlock('deep_sea_queen');
  // Night planner
  const h=new Date().getHours();
  if(h>=0&&h<5)tryUnlock('night_planner');
  // Serial grudge (3 in same week)
  const oneWeekAgo=Date.now()-7*86400000;
  const recentCount=enemies.filter(x=>new Date(x.createdAt).getTime()>oneWeekAgo).length;
  if(recentCount>=3)tryUnlock('serial_grudge');
  // Long memory check for existing enemies
  enemies.forEach(x=>{
    if(daysSince(x.createdAt)>=365)tryUnlock('long_memory');
  });
}

function checkGrudgeMaster(){
  if(enemies.length>0&&enemies.every(e=>e.status!=='lurk')){
    tryUnlock('grudge_master');
  }
}

// ============================================================
// SHARE CARD
// ============================================================
function genShareCard(){
  const canvas=document.getElementById('shareCanvas');
  const ctx=canvas.getContext('2d');
  const W=400,H=560;
  canvas.width=W;canvas.height=H;
  const bgImg=new Image();
  bgImg.onload=function(){
    ctx.drawImage(bgImg,0,0,W,H);
    ctx.fillStyle='rgba(10,14,26,0.72)';
    ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(79,195,247,0.3)';
    ctx.lineWidth=2;
    ctx.strokeRect(16,16,W-32,H-32);
    ctx.textAlign='center';
    ctx.font='bold 20px "Space Mono",monospace';
    ctx.fillStyle='#4fc3f7';
    ctx.fillText('PISCES HIT LIST',W/2,60);
    const total=enemies.length,caught=enemies.filter(e=>e.status==='caught').length,avgLevel=total?((enemies.reduce((s,e)=>s+e.level,0)/total).toFixed(1)):'0';
    ctx.font='300 14px sans-serif';ctx.fillStyle='#8892b0';ctx.fillText('我是双鱼女',W/2,110);
    ctx.font='bold 64px "Space Mono",monospace';ctx.fillStyle='#c8d0e8';ctx.fillText(String(total),W/2,200);
    ctx.font='14px sans-serif';ctx.fillStyle='#8892b0';ctx.fillText('个仇人',W/2,228);
    ctx.font='bold 28px "Space Mono",monospace';ctx.fillStyle='#69f0ae';ctx.fillText(String(caught),W/4,320);ctx.fillStyle='#ff5252';ctx.fillText(avgLevel,W*3/4,320);
    ctx.font='12px sans-serif';ctx.fillStyle='#5a6480';ctx.fillText('已收网',W/4,345);ctx.fillText('平均憎恨',W*3/4,345);
    ctx.font='15px sans-serif';ctx.fillStyle='#4fc3f7';ctx.fillText('别惹双鱼女。',W/2,420);
    ctx.font='10px "Space Mono",monospace';ctx.fillStyle='rgba(90,100,128,0.6)';ctx.fillText('本程序由一个被惹毛的双鱼女驱动',W/2,510);
    document.getElementById('shareImg').src=canvas.toDataURL('image/png');
    document.getElementById('shareOverlay').classList.add('open');
  };
  bgImg.src=IMG_SHARE;
}
function closeShare(){document.getElementById('shareOverlay').classList.remove('open')}

// ============================================================
// EXPORT / IMPORT
// ============================================================
function exportData(){
  const data={enemies,unlocked,exportDate:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='pisces-hit-list-backup.json';
  a.click();
}
function importData(evt){
  const file=evt.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(data.enemies){
        if(!confirm('导入将覆盖当前数据，确定？'))return;
        enemies=data.enemies;
        unlocked=data.unlocked||[];
        save();renderAll();
        showToast('导入成功');
      }
    }catch(err){showToast('文件格式错误')}
  };
  reader.readAsText(file);
}
